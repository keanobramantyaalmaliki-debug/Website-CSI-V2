<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSI Lounge — Export Test</title>
<style>
  body { margin: 0; overflow: hidden; background: #111; }
  #info {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    color: #eee; font: 13px/1.5 -apple-system, sans-serif;
    background: rgba(0,0,0,.55); padding: 10px 14px; border-radius: 8px;
  }
  #info b { color: #ffd479; }
</style>
</head>
<body>
<div id="info">
  <b>CSI Lounge — export test v2</b><br>
  Drag: orbit &nbsp;|&nbsp; Scroll: zoom &nbsp;|&nbsp; Klik kanan: pan<br>
  <span id="stats">loading…</span>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.55;              // turun dari 1.0 — tadi kebakar
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0c);

// environment map redup — bikin material glossy (lantai tile, metal) punya
// sesuatu buat direfleksiin; tanpa ini glossy = hitam mati
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.25;

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.05, 100);
// glTF Y-up: three(x, y, z) = blender(x, z, -y)
// DI DALAM ruangan: blender (0.3, -7.3, 1.55) dekat front desk, lihat ke arah lounge
camera.position.set(0.3, 1.55, 7.3);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.1, -3.0);     // blender (0, 3.0, 1.1) — area billiard/lounge
controls.enableDamping = true;

// pengganti 2 AREA light yang nggak ke-export — redup aja, biar mood gelap kejaga
// ambient tipis aja — fill light sekarang udah dari GLB (2 point pengganti area)
const amb = new THREE.AmbientLight(0xfff2e6, 0.15);
scene.add(amb);

// bloom: threshold dinaikin — cuma emission (bohlam, indikator) yang glow, bukan lantai kena lampu
const composer = new EffectComposer(renderer);
const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.5, 1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const loader = new GLTFLoader();
const t0 = performance.now();
loader.load('./lounge.glb', (gltf) => {
  const ms = (performance.now() - t0).toFixed(0);
  scene.add(gltf.scene);

  // kumpulkan posisi semua lampu dulu
  const lightPos = [];
  gltf.scene.updateMatrixWorld(true);
  gltf.scene.traverse(o => {
    if (o.isLight) lightPos.push(o.getWorldPosition(new THREE.Vector3()));
  });
  const nearLight = (obj) => {
    // pakai center bounding box, bukan origin — banyak mesh origin-nya di (0,0,0)
    const box = new THREE.Box3().setFromObject(obj);
    if (box.isEmpty()) return false;
    const c = box.getCenter(new THREE.Vector3());
    return lightPos.some(lp => lp.distanceTo(c) < 0.45);
  };

  let meshes = 0, tris = 0, lights = 0;
  gltf.scene.traverse(o => {
    if (o.isMesh) {
      meshes++;
      const g = o.geometry;
      tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
      o.receiveShadow = true;
      // housing lampu (cage/kabel/bohlam/socket) jangan cast shadow —
      // bikin motif jaring tajam di dinding, nggak realistis
      o.castShadow = !nearLight(o);
      // emission perlu di-boost dikit biar keangkat bloom
      if (o.material && o.material.emissive &&
          (o.material.emissive.r + o.material.emissive.g + o.material.emissive.b) > 0.1) {
        o.material.emissiveIntensity = Math.max(o.material.emissiveIntensity, 2.5);
      }
    }
    if (o.isLight) {
      lights++;
      // clamp lebih rendah lagi — pool cahaya tadi masih kebakar
      o.intensity = Math.min(o.intensity, 6);
      o.decay = 2;
      o.castShadow = true;
      if (o.shadow) {
        o.shadow.mapSize.set(2048, 2048);   // resolusi naik biar bayangan tajam
        o.shadow.bias = -0.0004;            // bias kecil — tadi -0.002 bikin bayangan "lepas" dari objek
        o.shadow.normalBias = 0.02;
        o.shadow.camera.near = 0.05;
        o.shadow.camera.far = 12;
        o.shadow.radius = 4;                // soft edge
      }
    }
  });
  document.getElementById('stats').textContent =
    `load ${ms}ms | ${meshes} mesh | ${Math.round(tris).toLocaleString()} tris | ${lights} lights | exposure 0.55 + bloom`;
}, undefined, (err) => {
  document.getElementById('stats').textContent = 'GAGAL load: ' + err.message;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  composer.render();
});
</script>
</body>
</html>
