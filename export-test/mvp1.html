<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSI Office Tour — MVP 1</title>
<style>
  body { margin: 0; overflow: hidden; background: #111;
         font: 12px/1.5 -apple-system, sans-serif; }
  #hud {
    position: fixed; top: 10px; left: 10px; z-index: 10; color: #eee;
    background: rgba(0,0,0,.72); padding: 10px 12px; border-radius: 8px;
    width: 300px; backdrop-filter: blur(6px);
  }
  #hud b { color: #ffd479; }
  #stats { display:block; margin: 6px 0; font-variant-numeric: tabular-nums;
           color:#9fd; white-space: pre-line; }
  .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .row label { flex: 1; color: #bbb; }
  .row input[type=range] { width: 110px; }
  .row .val { width: 34px; text-align: right; color: #ffd479; }
  button {
    background: #2a2a2e; color: #ddd; border: 1px solid #444; border-radius: 5px;
    padding: 3px 8px; margin: 2px 3px 0 0; font-size: 11px; cursor: pointer;
  }
  button:hover { background: #3a3a40; }
  button.on { background: #4a7; color: #fff; border-color: #5b8; }
  hr { border: 0; border-top: 1px solid #333; margin: 8px 0; }
  #fps { font-size: 22px; font-weight: 600; }
  .warn { color: #f96; }
  .good { color: #7d8; }
</style>
</head>
<body>
<div id="hud">
  <b>CSI Office Tour — MVP 1</b>
  <span id="stats">loading…</span>
  <hr>
  <div class="row">
    <label>Lampu aktif</label>
    <input type="range" id="nlight" min="0" max="39" value="6">
    <span class="val" id="nlightv">6</span>
  </div>
  <div class="row">
    <label>Shadow (lampu)</label>
    <input type="range" id="nshadow" min="0" max="8" value="0">
    <span class="val" id="nshadowv">0</span>
  </div>
  <div class="row">
    <label>Exposure</label>
    <input type="range" id="expo" min="20" max="200" value="55">
    <span class="val" id="expov">.55</span>
  </div>
  <div>
    <button id="bBloom">Bloom</button>
    <button id="bAmb" class="on">Ambient+</button>
    <button id="bEnv" class="on">EnvMap</button>
    <button id="bMerge">Gabung mesh</button>
  </div>
  <hr>
  <div id="views"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.166.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.166.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.55;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;   // shadow statis: render sekali saja
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0c);

const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex;
scene.environmentIntensity = 0.35;

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.05, 120);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const bl = (x, y, z) => new THREE.Vector3(x, z, -y);
const VIEWS = {
  'Office':   { pos: bl(-6.0, -4.0, 1.6),  tgt: bl(-11.0, -3.0, 1.1) },
  'Lounge':   { pos: bl( 0.3, -7.3, 1.55), tgt: bl(  0.0,  3.0, 1.1) },
  'Meeting':  { pos: bl(-16.2,-0.4, 1.6),  tgt: bl(-20.5, -0.4, 1.3) },
  'Pantry':   { pos: bl(-15.5,-5.5, 1.7),  tgt: bl(-17.5, -3.2, 1.2) },
  'Function': { pos: bl( 0.0,  7.6, 1.6),  tgt: bl( -0.5, 10.5, 1.2) },
};
let curView = 'Office';
function goTo(n){ curView=n; camera.position.copy(VIEWS[n].pos);
                  controls.target.copy(VIEWS[n].tgt); controls.update(); refreshLights(); }
const vbox = document.getElementById('views');
Object.keys(VIEWS).forEach(n => {
  const b=document.createElement('button'); b.textContent=n; b.onclick=()=>goTo(n); vbox.appendChild(b);
});

const amb = new THREE.AmbientLight(0xfff2e6, 0.55);
scene.add(amb);
const hemi = new THREE.HemisphereLight(0xbfd4ff, 0x40352a, 0.35);
scene.add(hemi);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.5, 1.0);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());
let useBloom = false;   // default OFF — bloom = 1 fullscreen pass mahal

const draco = new DRACOLoader();
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.166.0/examples/jsm/libs/draco/');
const loader = new GLTFLoader();
loader.setDRACOLoader(draco);

let allLights = [], allMeshes = [], root = null, merged = null;
let baseInfo = '';

const t0 = performance.now();
loader.load('./office-mvp1-webp.glb', (gltf) => {
  const loadMs = (performance.now() - t0).toFixed(0);
  root = gltf.scene;
  scene.add(root);
  root.updateMatrixWorld(true);

  root.traverse(o => {
    if (o.isLight)  { allLights.push(o); o.castShadow = false;
                      o.intensity = Math.min(o.intensity, 6); o.decay = 2; }
    if (o.isMesh)   { allMeshes.push(o); o.castShadow = false; o.receiveShadow = true;
                      if (o.material?.emissive &&
                          (o.material.emissive.r+o.material.emissive.g+o.material.emissive.b) > 0.1)
                        o.material.emissiveIntensity = Math.max(o.material.emissiveIntensity, 2.5);
                    }
  });

  let tris = 0;
  allMeshes.forEach(m => { const g=m.geometry;
    tris += (g.index ? g.index.count : g.attributes.position.count)/3; });

  const mats = new Set(); allMeshes.forEach(m => mats.add(m.material?.uuid));
  baseInfo = `load ${loadMs}ms · ${allMeshes.length} mesh · ${Math.round(tris).toLocaleString()} tris\n`
           + `${allLights.length} lampu di GLB · ${mats.size} material`;

  goTo('Office');
}, (p) => {
  if (p.total) document.getElementById('stats').textContent =
    `loading ${(p.loaded/1048576).toFixed(1)} / ${(p.total/1048576).toFixed(1)} MB`;
}, (err) => {
  document.getElementById('stats').textContent = 'GAGAL load: ' + err.message;
});

// --- lampu: hanya N terdekat kamera yang aktif ---
let nLight = 6, nShadow = 0;
function refreshLights() {
  if (!allLights.length) return;
  const cam = camera.position;
  const sorted = allLights
    .map(l => ({ l, d: l.getWorldPosition(new THREE.Vector3()).distanceTo(cam) }))
    .sort((a,b) => a.d - b.d);
  sorted.forEach((e, i) => {
    e.l.visible = i < nLight;
    const wantShadow = i < nShadow && i < nLight;
    if (e.l.castShadow !== wantShadow) {
      e.l.castShadow = wantShadow;
      if (wantShadow && e.l.shadow) {
        e.l.shadow.mapSize.set(1024,1024);
        e.l.shadow.bias = -0.0004; e.l.shadow.normalBias = 0.02;
        e.l.shadow.camera.near = 0.05; e.l.shadow.camera.far = 14; e.l.shadow.radius = 4;
      }
    }
  });
  renderer.shadowMap.needsUpdate = true;
}

// --- gabung mesh per material: pangkas draw call ---
function mergeMeshes() {
  if (!root || merged) return;
  const groups = new Map();
  allMeshes.forEach(m => {
    if (!m.geometry?.attributes?.position) return;
    const key = m.material.uuid;
    if (!groups.has(key)) groups.set(key, { mat: m.material, geos: [] });
    const g = m.geometry.clone();
    g.applyMatrix4(m.matrixWorld);
    for (const k of Object.keys(g.attributes))
      if (!['position','normal','uv'].includes(k)) g.deleteAttribute(k);
    if (!g.attributes.uv && g.attributes.position)
      g.setAttribute('uv', new THREE.BufferAttribute(
        new Float32Array(g.attributes.position.count*2), 2));
    if (!g.attributes.normal) g.computeVertexNormals();
    groups.get(key).geos.push(g);
  });
  merged = new THREE.Group();
  groups.forEach(({mat, geos}) => {
    if (!geos.length) return;
    try {
      const g = BufferGeometryUtils.mergeGeometries(geos, false);
      if (g) { const mm = new THREE.Mesh(g, mat); mm.receiveShadow = true; merged.add(mm); }
    } catch(e) { geos.forEach(gg => merged.add(new THREE.Mesh(gg, mat))); }
  });
  allMeshes.forEach(m => m.visible = false);
  scene.add(merged);
}
function unmergeMeshes() {
  if (!merged) return;
  scene.remove(merged);
  merged.traverse(o => { if (o.isMesh) o.geometry.dispose(); });
  merged = null;
  allMeshes.forEach(m => m.visible = true);
}

// --- UI ---
const $ = id => document.getElementById(id);
$('nlight').oninput = e => { nLight = +e.target.value; $('nlightv').textContent = nLight;
                             $('nshadow').max = Math.min(8, nLight); refreshLights(); };
$('nshadow').oninput = e => { nShadow = +e.target.value; $('nshadowv').textContent = nShadow;
                              refreshLights(); };
$('expo').oninput = e => { const v = +e.target.value/100;
                           renderer.toneMappingExposure = v; $('expov').textContent = v.toFixed(2); };
$('bBloom').onclick = e => { useBloom = !useBloom; e.target.classList.toggle('on', useBloom); };
$('bAmb').onclick = e => { const on = amb.intensity < 0.3;
  amb.intensity = on ? 0.55 : 0.12; hemi.intensity = on ? 0.35 : 0.0;
  e.target.classList.toggle('on', on); };
$('bEnv').onclick = e => { const on = !scene.environment;
  scene.environment = on ? envTex : null; e.target.classList.toggle('on', on); };
$('bMerge').onclick = e => { if (merged) { unmergeMeshes(); e.target.classList.remove('on'); }
                             else { mergeMeshes(); e.target.classList.add('on'); } };

// --- loop + statistik ---
let frames = 0, last = performance.now(), fps = 0;
renderer.setAnimationLoop(() => {
  frames++;
  const now = performance.now();
  if (now - last >= 500) { fps = Math.round(frames * 1000 / (now - last)); frames = 0; last = now; }
  controls.update();
  if (useBloom) composer.render(); else renderer.render(scene, camera);

  if (frames === 0) {
    const i = renderer.info.render;
    const cls = fps >= 50 ? 'good' : (fps >= 25 ? '' : 'warn');
    $('stats').innerHTML =
      `<span id="fps" class="${cls}">${fps} fps</span>  `
      + `<span style="color:#999">draw ${i.calls} · tri ${(i.triangles/1000).toFixed(0)}k</span>\n`
      + baseInfo;
  }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
