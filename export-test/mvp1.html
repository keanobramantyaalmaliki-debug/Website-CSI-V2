<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSI Office Tour</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #0a0a0c;
         font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #fff; }

  /* room label — top left */
  #room-name { position: fixed; top: 28px; left: 32px; z-index: 20; pointer-events: none; }
  #rn-title  { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.5px;
               text-shadow: 0 2px 24px rgba(0,0,0,.95); }
  #rn-sub    { margin: 5px 0 0; font-size: 10px; color: rgba(255,255,255,.38);
               letter-spacing: 2.5px; text-transform: uppercase; }

  /* nav dots — right */
  #nav { position: fixed; right: 24px; top: 50%; transform: translateY(-50%);
         z-index: 20; display: flex; flex-direction: column; gap: 12px; align-items: flex-end; }
  .dot-wrap  { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .dot-label { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase;
               color: rgba(255,255,255,.3); opacity: 0; transition: opacity .2s; pointer-events: none; }
  .dot-wrap:hover .dot-label,
  .dot-wrap.active .dot-label { opacity: 1; }
  .dot-wrap.active .dot-label { color: rgba(255,255,255,.7); }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
         background: rgba(255,255,255,.18); border: 1.5px solid rgba(255,255,255,.28);
         transition: all .25s; }
  .dot-wrap.active .dot { background: #fff; border-color: #fff; }
  .dot-wrap:hover .dot  { background: rgba(255,255,255,.5); }
  .dot-wrap.disabled    { cursor: default; opacity: .3; }
  .dot-wrap.disabled .dot { background: transparent; }
  .dot-wrap.disabled:hover .dot { background: transparent; }
  .dot-wrap.disabled .dot-label { opacity: 0 !important; }

  /* scroll hint */
  #hint { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
          z-index: 20; text-align: center; pointer-events: none;
          color: rgba(255,255,255,.32); font-size: 9px; letter-spacing: 2.5px;
          text-transform: uppercase; transition: opacity 1s; }
  #hint .arr { display: block; margin-top: 5px; font-size: 14px;
               animation: bob .9s ease-in-out infinite alternate; }
  @keyframes bob { to { transform: translateY(5px); } }

  /* mini stats (tekan S) */
  #mini-stats { position: fixed; bottom: 10px; right: 14px; z-index: 20;
                font: 10px/1.6 monospace; color: rgba(255,255,255,.28);
                opacity: 0; transition: opacity .3s; pointer-events: none; }
  #mini-stats.on { opacity: 1; }

  /* renderer badge (WebGPU / WebGL2) */
  #gpu-badge { position: fixed; top: 28px; right: 24px; z-index: 20;
               font: 9px/1 monospace; letter-spacing: 1px; text-transform: uppercase;
               color: rgba(255,255,255,.22); pointer-events: none; }

  /* CSS2D hotspot labels */
  .hotspot { padding: 5px 11px; border-radius: 3px; cursor: pointer;
             font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
             background: rgba(10,10,12,.65); border: 1px solid rgba(255,255,255,.14);
             backdrop-filter: blur(8px); white-space: nowrap;
             transition: background .2s, border-color .2s, opacity .3s;
             pointer-events: auto; }
  .hotspot:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.4); }
  .hotspot.hide  { opacity: 0; pointer-events: none; }

  /* loader */
  #loader { position: fixed; inset: 0; z-index: 100; background: #0a0a0c;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 14px; transition: opacity .6s; }
  #ld-track { width: 180px; height: 1px; background: rgba(255,255,255,.1); }
  #ld-fill  { height: 100%; background: #fff; width: 0; transition: width .25s; }
  #ld-text  { font-size: 9px; letter-spacing: 2.5px; text-transform: uppercase;
              color: rgba(255,255,255,.3); margin: 0; }
</style>
</head>
<body>

<div id="loader">
  <div id="ld-track"><div id="ld-fill"></div></div>
  <p id="ld-text">Loading</p>
</div>

<div id="room-name">
  <h1 id="rn-title">—</h1>
  <p  id="rn-sub">CSI Office Tour</p>
</div>

<div id="nav"></div>
<div id="hint">Scroll to Explore <span class="arr">↓</span></div>
<div id="mini-stats"></div>
<div id="gpu-badge"></div>

<script type="importmap">
{
  "imports": {
    "three":         "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.webgpu.js",
    "three/tsl":     "https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.tsl.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE                      from 'three';
import { OrbitControls }               from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }                  from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }                 from 'three/addons/loaders/DRACOLoader.js';
import { KTX2Loader }                  from 'three/addons/loaders/KTX2Loader.js';
import { RoomEnvironment }             from 'three/addons/environments/RoomEnvironment.js';
import { CSS2DRenderer, CSS2DObject }  from 'three/addons/renderers/CSS2DRenderer.js';

const $ = id => document.getElementById(id);
const CDN = 'https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/';

// ── WebGPU Renderer (auto-fallback ke WebGL2) ─────────────────────────────
const renderer = new THREE.WebGPURenderer({ antialias: true, powerPreference: 'high-performance' });
await renderer.init();
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

// badge: tunjukkan apakah pakai WebGPU atau WebGL2
$('gpu-badge').textContent = renderer.backend?.isWebGPUBackend ? 'WebGPU' : 'WebGL2';

// ── CSS2D Renderer ────────────────────────────────────────────────────────
const css2d = new CSS2DRenderer();
css2d.setSize(innerWidth, innerHeight);
Object.assign(css2d.domElement.style,
  { position:'fixed', top:'0', left:'0', pointerEvents:'none', zIndex:'10' });
document.body.appendChild(css2d.domElement);

// ── Scene ─────────────────────────────────────────────────────────────────
const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0c);

const pmrem  = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment          = envTex;
scene.environmentIntensity = 0.18;   // low — lightmap sudah handle main lighting

// Ambient minimal: fill spot yang mungkin terlewat saat bake
const amb = new THREE.AmbientLight(0xffffff, 0.12);
scene.add(amb);

// ── Camera + Controls ─────────────────────────────────────────────────────
const camera   = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 120);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.enableZoom    = false;  // scroll dipakai untuk room navigation
controls.enabled       = false;  // aktifkan setelah model load

// ── Coord helper (Blender → Three.js) ────────────────────────────────────
const bl = (x, y, z) => new THREE.Vector3(x, z, -y);

// ── Views ─────────────────────────────────────────────────────────────────
const VIEW_KEYS = ['Office', 'Lounge', 'Meeting', 'Function', 'Pantry'];
const VIEWS = {
  Office:   { pos: bl(-6.0, -4.0, 1.6),  tgt: bl(-11.0, -3.0, 1.1), sub: 'Main workspace'     },
  Lounge:   { pos: bl( 0.3, -7.3, 1.55), tgt: bl(  0.0,  3.0, 1.1), sub: 'Reception & lounge' },
  Meeting:  { pos: bl(-16.2,-0.4, 1.6),  tgt: bl(-20.5, -0.4, 1.3), sub: 'Conference room'     },
  Function: { pos: bl( 0.0,  7.6, 1.6),  tgt: bl( -0.5, 10.5, 1.2), sub: 'Function hall'       },
  Pantry:   { pos: bl(-15.5,-5.5, 1.7),  tgt: bl(-17.5, -3.2, 1.2), sub: 'Pantry & break room', disabled: true }
};

// ── Active keys (excludes disabled views for scroll navigation) ───────────
const ACTIVE_KEYS = VIEW_KEYS.filter(k => !VIEWS[k].disabled);

// ── Nav dots ──────────────────────────────────────────────────────────────
const navEl = $('nav');
VIEW_KEYS.forEach(k => {
  const wrap  = document.createElement('div');
  const dis   = !!VIEWS[k].disabled;
  wrap.className = 'dot-wrap' + (dis ? ' disabled' : ''); wrap.dataset.key = k;
  const label = document.createElement('span');
  label.className = 'dot-label'; label.textContent = k;
  const dot = document.createElement('div'); dot.className = 'dot';
  wrap.append(label, dot);
  if (!dis) wrap.onclick = () => goTo(k);
  navEl.appendChild(wrap);
});
function updateDots() {
  navEl.querySelectorAll('.dot-wrap').forEach(w =>
    w.classList.toggle('active', w.dataset.key === curView));
}

// ── Camera animation ──────────────────────────────────────────────────────
let curView   = 'Office';
let curIdx    = 0;
let animating = false;
let animStart = 0;
const ANIM_MS = 1400;
const fromPos = new THREE.Vector3();
const fromTgt = new THREE.Vector3();

function ease(t) { return t < .5 ? 2*t*t : -1+(4-2*t)*t; }  // cubic in-out

function goTo(name, instant = false) {
  if (VIEWS[name]?.disabled) return;
  if (name === curView && !instant) return;
  curView = name;
  curIdx  = ACTIVE_KEYS.indexOf(name);
  if (location.hash.slice(1) !== name.toLowerCase())
    history.pushState(null, '', '#' + name.toLowerCase());
  updateDots();
  $('rn-title').textContent = name;
  $('rn-sub').textContent   = VIEWS[name].sub;
  updateHotspots();
  if (instant) {
    camera.position.copy(VIEWS[name].pos);
    controls.target.copy(VIEWS[name].tgt);
    controls.update();
    return;
  }
  fromPos.copy(camera.position);
  fromTgt.copy(controls.target);
  animStart = performance.now();
  animating = true;
  controls.enabled = false;
}

const nextRoom = () => goTo(ACTIVE_KEYS[(curIdx + 1) % ACTIVE_KEYS.length]);
const prevRoom = () => goTo(ACTIVE_KEYS[(curIdx - 1 + ACTIVE_KEYS.length) % ACTIVE_KEYS.length]);

// ── Input ─────────────────────────────────────────────────────────────────
// Guard: tunggu animasi selesai dulu sebelum terima input berikutnya
let lastScroll = 0;
window.addEventListener('wheel', e => {
  e.preventDefault();
  if (animating) return;                        // blok selama kamera masih tween
  const now = performance.now();
  if (now - lastScroll < 200) return;           // buffer singkat anti double-fire
  lastScroll = now;
  $('hint').style.opacity = '0';
  e.deltaY > 0 ? nextRoom() : prevRoom();
}, { passive: false });

window.addEventListener('keydown', e => {
  if (e.key==='ArrowDown'||e.key==='ArrowRight') {
    if (animating) return;
    $('hint').style.opacity='0'; nextRoom();
  }
  if (e.key==='ArrowUp'||e.key==='ArrowLeft') {
    if (animating) return;
    $('hint').style.opacity='0'; prevRoom();
  }
  if (e.key==='s'||e.key==='S') $('mini-stats').classList.toggle('on');
});

let touchY0 = 0;
window.addEventListener('touchstart', e => { touchY0 = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchend', e => {
  if (animating) return;
  const dy = touchY0 - e.changedTouches[0].clientY;
  if (Math.abs(dy) > 50) { $('hint').style.opacity='0'; dy > 0 ? nextRoom() : prevRoom(); }
});

window.addEventListener('popstate', () => {
  const k = VIEW_KEYS.find(k => k.toLowerCase() === location.hash.slice(1));
  if (k && k !== curView) goTo(k);
});

// ── CSS2D Hotspots ────────────────────────────────────────────────────────
const hotspots = {};
function buildHotspots() {
  VIEW_KEYS.forEach(k => {
    const el = document.createElement('div');
    el.className = 'hotspot'; el.textContent = k;
    el.onclick   = () => goTo(k);
    const obj = new CSS2DObject(el);
    const t   = VIEWS[k].tgt.clone(); t.y += 0.7;
    obj.position.copy(t);
    scene.add(obj);
    hotspots[k] = el;
  });
  updateHotspots();
}
function updateHotspots() {
  Object.entries(hotspots).forEach(([k, el]) =>
    el.classList.toggle('hide', k === curView || !!VIEWS[k].disabled));
}

// ── Loaders ───────────────────────────────────────────────────────────────
const ktx2Loader = new KTX2Loader()
  .setTranscoderPath(CDN + 'libs/basis/')
  .detectSupport(renderer);

const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath(CDN + 'libs/draco/');

const gltfLoader = new GLTFLoader();
gltfLoader.setDRACOLoader(dracoLoader);
gltfLoader.setKTX2Loader(ktx2Loader);

// ── Baked lighting state ──────────────────────────────────────────────────
let lmMats = [], emissiveMats = [];

// Pilih file: pakai final (KTX2) kalau ada, fallback ke baked
const GLB_URL = './office-mvp1-final.glb';

gltfLoader.load(GLB_URL,
  gltf => {
    scene.add(gltf.scene);
    gltf.scene.updateMatrixWorld(true);

    gltf.scene.traverse(o => {
      // Matikan semua real-time light dari GLB — cahaya sudah di-bake
      if (o.isLight) { o.intensity = 0; return; }
      if (!o.isMesh || !o.material) return;

      o.castShadow    = false;
      o.receiveShadow = false;
      const m = o.material;

      // Lightmap: di-export via aoMap slot (texCoord=1) dari Blender
      // Pembeda andal: lightmap kita pakai channel=1, aoMap asli aset pakai channel=0
      if (m.aoMap?.channel === 1 && !m.lightMap) {
        m.lightMap         = m.aoMap;
        m.lightMap.channel = 1;
        m.aoMap            = null;
        const g = o.geometry;
        if (!g.attributes.uv1) {
          const src = g.attributes.uv2 || g.attributes.uv;
          if (src) g.setAttribute('uv1', src);
        }
        m.needsUpdate = true;
      }
      if (m.lightMap) {
        m.lightMapIntensity = 1.0;
        lmMats.push(m);
      }

      // Emissive: jangan clamp, toneMapped=false agar tidak diredam ACES
      if (m.emissive && m.emissive.r + m.emissive.g + m.emissive.b > 0.01) {
        m.userData.baseEmissive = m.emissiveIntensity;
        m.toneMapped            = false;
        emissiveMats.push(m);
      }
    });

    buildHotspots();

    const hash  = location.hash.slice(1).toLowerCase();
    const start = VIEW_KEYS.find(k => k.toLowerCase() === hash) ?? 'Office';
    goTo(start, true);
    controls.enabled = true;

    $('loader').style.opacity = '0';
    setTimeout(() => $('loader').remove(), 700);
  },
  p => {
    if (!p.total) return;
    const pct = (p.loaded / p.total * 100).toFixed(0);
    $('ld-fill').style.width = pct + '%';
    $('ld-text').textContent = `Loading ${pct}%`;
  },
  // Fallback ke baked.glb jika final.glb belum ada
  () => {
    $('ld-text').textContent = 'Loading (baked)';
    gltfLoader.load('./office-mvp1-baked.glb',
      gltf => {
        scene.add(gltf.scene);
        gltf.scene.updateMatrixWorld(true);
        gltf.scene.traverse(o => {
          if (o.isLight) { o.intensity = 0; return; }
          if (!o.isMesh || !o.material) return;
          o.castShadow = o.receiveShadow = false;
          const m = o.material;
          if (m.aoMap?.channel === 1 && !m.lightMap) {
            m.lightMap = m.aoMap; m.lightMap.channel = 1; m.aoMap = null;
            const g = o.geometry;
            if (!g.attributes.uv1) {
              const src = g.attributes.uv2 || g.attributes.uv;
              if (src) g.setAttribute('uv1', src);
            }
            m.needsUpdate = true;
          }
          if (m.lightMap) { m.lightMapIntensity = 1.0; lmMats.push(m); }
          if (m.emissive && m.emissive.r + m.emissive.g + m.emissive.b > 0.01) {
            m.userData.baseEmissive = m.emissiveIntensity;
            m.toneMapped = false; emissiveMats.push(m);
          }
        });
        buildHotspots();
        const hash  = location.hash.slice(1).toLowerCase();
        const start = VIEW_KEYS.find(k => k.toLowerCase() === hash) ?? 'Office';
        goTo(start, true);
        controls.enabled = true;
        $('loader').style.opacity = '0';
        setTimeout(() => $('loader').remove(), 700);
      },
      p => {
        if (!p.total) return;
        const pct = (p.loaded / p.total * 100).toFixed(0);
        $('ld-fill').style.width = pct + '%';
        $('ld-text').textContent = `Loading ${pct}%`;
      },
      err => { $('ld-text').textContent = 'Error: ' + err.message; }
    );
  }
);

// ── Stats ─────────────────────────────────────────────────────────────────
let frames = 0, lastT = performance.now(), fps = 0;

// ── Render loop ───────────────────────────────────────────────────────────
renderer.setAnimationLoop(() => {
  const now = performance.now();
  frames++;
  if (now - lastT >= 500) {
    fps    = Math.round(frames * 1000 / (now - lastT));
    frames = 0; lastT = now;
    const info = renderer.info?.render ?? {};
    $('mini-stats').textContent =
      `${fps} fps  ·  draw ${info.calls ?? 0}  ·  tri ${((info.triangles ?? 0)/1000).toFixed(0)}k`;
  }

  if (animating) {
    const t = Math.min((now - animStart) / ANIM_MS, 1);
    camera.position.lerpVectors(fromPos, VIEWS[curView].pos, ease(t));
    controls.target.lerpVectors(fromTgt, VIEWS[curView].tgt, ease(t));
    if (t >= 1) {
      animating        = false;
      controls.enabled = true;
      camera.position.copy(VIEWS[curView].pos);
      controls.target.copy(VIEWS[curView].tgt);
    }
  }

  controls.update();
  renderer.render(scene, camera);
  css2d.render(scene, camera);
});

// ── Resize ────────────────────────────────────────────────────────────────
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  css2d.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
